name: Check color schemes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check the scheme files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check every scheme file and credits.json
        run: npm run validate

      - name: Check that the README list and preview images are up to date
        run: npm run catalog -- --check

      - name: Check that the gallery builds
        run: npm run build
