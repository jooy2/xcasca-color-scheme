name: Report a problem
description: A scheme that does not import, looks wrong, or is hard to read, or a problem with the gallery or the docs.
labels: ["problem"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - A color scheme file
        - The gallery page
        - The documentation
    validations:
      required: true
  - type: input
    id: scheme
    attributes:
      label: Scheme
      description: The scheme's name, if the problem is with a scheme.
      placeholder: Harbor Night
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Xcasca version and platform
      description: For a problem with a scheme in the app.
      placeholder: 1.1.2 on Windows 11
  - type: input
    id: browser
    attributes:
      label: Browser
      description: For a problem with the gallery page.
      placeholder: Firefox 140 on macOS
